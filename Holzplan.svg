<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800">
<defs>
  <!-- Dimension arrow: tip points in line direction (for marker-end) -->
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L0,8 L8,4 Z" fill="#444"/>
  </marker>
  <!-- Dimension arrow: tip points opposite (for marker-start) -->
  <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0,0 L0,8 L8,4 Z" fill="#444"/>
  </marker>
</defs>

<rect width="680" height="800" fill="white"/>

<!-- ── Titel ──────────────────────────────────────────────── -->
<text x="340" y="30" font-family="Arial,sans-serif" font-size="16" font-weight="bold"
      text-anchor="middle" fill="#111">Kita-Lärmampel — Gehäuse-Aufriss</text>
<text x="340" y="50" font-family="Arial,sans-serif" font-size="11"
      text-anchor="middle" fill="#777">Maßstab 1:5 · 1 cm = 10 px · Maße in cm</text>

<!-- ═══════════════════════════════════════════════════════════
     VORDERANSICHT  Ursprung (90, 100)  150 × 500 px
     ═══════════════════════════════════════════════════════════ -->
<text x="165" y="82" font-family="Arial,sans-serif" font-size="13" font-weight="bold"
      text-anchor="middle" fill="#222">Vorderansicht</text>

<!-- Holzfläche -->
<rect x="90" y="100" width="150" height="500" fill="#EDD9A3" stroke="#444" stroke-width="2"/>

<!-- Feld ROT (oben)  y=112  h=150 -->
<rect x="90" y="112" width="150" height="150" fill="#E03030" opacity="0.85"/>
<text x="165" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="bold"
      text-anchor="middle" fill="white">ROT</text>

<!-- Feld GELB (Mitte)  y=275  h=150 -->
<rect x="90" y="275" width="150" height="150" fill="#F5C400" opacity="0.90"/>
<text x="165" y="354" font-family="Arial,sans-serif" font-size="14" font-weight="bold"
      text-anchor="middle" fill="#444">GELB</text>

<!-- Feld GRÜN (unten)  y=438  h=150 -->
<rect x="90" y="438" width="150" height="150" fill="#22BB33" opacity="0.85"/>
<text x="165" y="518" font-family="Arial,sans-serif" font-size="14" font-weight="bold"
      text-anchor="middle" fill="white">GRÜN</text>

<!-- Außenrahmen über die Felder zeichnen -->
<rect x="90" y="100" width="150" height="500" fill="none" stroke="#333" stroke-width="2"/>

<!-- Trennsteg-Linien (gestrichelt) -->
<line x1="90" y1="262" x2="240" y2="262" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="90" y1="275" x2="240" y2="275" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="90" y1="425" x2="240" y2="425" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="90" y1="438" x2="240" y2="438" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>

<!-- == Bemaßung Vorderansicht == -->

<!-- Breite: 15 cm (oben) -->
<line x1="90" y1="75" x2="240" y2="75" stroke="#444" stroke-width="1.2"
      marker-start="url(#arr-s)" marker-end="url(#arr)"/>
<text x="165" y="71" font-family="Arial,sans-serif" font-size="11"
      text-anchor="middle" fill="#444">15 cm</text>
<line x1="90" y1="76" x2="90" y2="100" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="240" y1="76" x2="240" y2="100" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>

<!-- Gesamthöhe: 50 cm (links) -->
<line x1="50" y1="100" x2="50" y2="600" stroke="#444" stroke-width="1.2"
      marker-start="url(#arr-s)" marker-end="url(#arr)"/>
<text x="28" y="355" font-family="Arial,sans-serif" font-size="11"
      text-anchor="middle" fill="#444" transform="rotate(-90,28,355)">50 cm</text>
<line x1="51" y1="100" x2="90" y2="100" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="51" y1="600" x2="90" y2="600" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>

<!-- Randhöhe oben: ~1,25 cm (rechts) -->
<line x1="255" y1="100" x2="255" y2="112" stroke="#444" stroke-width="1.2"
      marker-start="url(#arr-s)" marker-end="url(#arr)"/>
<text x="310" y="109" font-family="Arial,sans-serif" font-size="10"
      text-anchor="start" fill="#555">~1,25 cm (Rand)</text>
<line x1="240" y1="100" x2="259" y2="100" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="240" y1="112" x2="259" y2="112" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>

<!-- Feldhöhe: 15 cm (rechts) -->
<line x1="255" y1="112" x2="255" y2="262" stroke="#444" stroke-width="1.2"
      marker-start="url(#arr-s)" marker-end="url(#arr)"/>
<text x="310" y="192" font-family="Arial,sans-serif" font-size="11"
      text-anchor="start" fill="#444">15 cm (Feld)</text>
<line x1="240" y1="262" x2="259" y2="262" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>

<!-- Trennsteg: ~1,25 cm (rechts) -->
<line x1="255" y1="262" x2="255" y2="275" stroke="#444" stroke-width="1.2"
      marker-start="url(#arr-s)" marker-end="url(#arr)"/>
<text x="310" y="271" font-family="Arial,sans-serif" font-size="10"
      text-anchor="start" fill="#555">~1,25 cm (Steg)</text>
<line x1="240" y1="275" x2="259" y2="275" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>

<!-- (weitere Felder/Stege symmetrisch — nicht alle beschriftet um Lesbarkeit zu wahren) -->

<!-- Drehschalter Unterseite -->
<text x="165" y="622" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#777">↓  Unterseite: Leise-Regler + Laut-Regler</text>

<!-- ═══════════════════════════════════════════════════════════
     SEITENANSICHT  Ursprung (430, 100)  100 × 500 px
     ═══════════════════════════════════════════════════════════ -->
<text x="480" y="82" font-family="Arial,sans-serif" font-size="13" font-weight="bold"
      text-anchor="middle" fill="#222">Seitenansicht</text>
<text x="480" y="95" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#888">(von rechts)</text>

<!-- Richtungshinweise -->
<text x="430" y="113" font-family="Arial,sans-serif" font-size="9"
      text-anchor="middle" fill="#999">↑ hinten</text>
<text x="530" y="113" font-family="Arial,sans-serif" font-size="9"
      text-anchor="middle" fill="#999">vorne ↑</text>

<!-- Holzfläche Seitenwand -->
<rect x="430" y="100" width="100" height="500" fill="#EDD9A3" stroke="#333" stroke-width="2"/>

<!-- Feldbegrenzungen (gestrichelt, gleiche y-Positionen wie Vorderansicht) -->
<line x1="430" y1="112" x2="530" y2="112" stroke="#CCC" stroke-width="0.8" stroke-dasharray="4,4"/>
<line x1="430" y1="262" x2="530" y2="262" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="430" y1="275" x2="530" y2="275" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="430" y1="425" x2="530" y2="425" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="430" y1="438" x2="530" y2="438" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="430" y1="588" x2="530" y2="588" stroke="#CCC" stroke-width="0.8" stroke-dasharray="4,4"/>

<!-- Feldbezeichnungen -->
<text x="480" y="192" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#C02020">ROT</text>
<text x="480" y="354" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#998800">GELB</text>
<text x="480" y="517" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#118822">GRÜN</text>

<!-- Mikrofon-Loch: in der Seitenwand, Mitte Feld GELB (y=350), 2 cm vom Vorderrand
     In der Seitenansicht von rechts: x-Achse = Tiefe (hinten=430, vorne=530)
     2 cm vom Vorderrand = 530 - 20 = 510 -->
<circle cx="510" cy="350" r="4" fill="white" stroke="#333" stroke-width="1.8"/>
<!-- Leader line -->
<line x1="514" y1="346" x2="548" y2="320" stroke="#555" stroke-width="0.9"/>
<circle cx="548" cy="320" r="1.5" fill="#555"/>
<text x="552" y="318" font-family="Arial,sans-serif" font-size="10" fill="#222">Mikrofon-Loch ⌀5 mm</text>
<text x="552" y="330" font-family="Arial,sans-serif" font-size="10" fill="#555">2 cm vom Vorderrand</text>
<text x="552" y="342" font-family="Arial,sans-serif" font-size="10" fill="#555">Mitte Feld GELB</text>

<!-- Bilderrahmen-Aufhänger (an der Rückwand = linke Kante in Seitenansicht) -->
<rect x="426" y="118" width="8" height="14" fill="#888" stroke="#555" stroke-width="1" rx="1"/>
<rect x="426" y="168" width="8" height="14" fill="#888" stroke="#555" stroke-width="1" rx="1"/>
<!-- Leader line -->
<line x1="426" y1="132" x2="395" y2="155" stroke="#555" stroke-width="0.9"/>
<text x="320" y="158" font-family="Arial,sans-serif" font-size="10" fill="#222">Bilderrahmen-Aufhänger (2×)</text>
<text x="320" y="170" font-family="Arial,sans-serif" font-size="10" fill="#555">an der Rückwand</text>

<!-- USB-Kabeldurchführung (Boden, gestrichelt) -->
<rect x="460" y="597" width="24" height="7" fill="none" stroke="#777"
      stroke-width="1.2" stroke-dasharray="3,2"/>
<line x1="472" y1="604" x2="472" y2="635" stroke="#666" stroke-width="0.9"/>
<text x="472" y="645" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#555">USB-Durchführung</text>
<text x="472" y="657" font-family="Arial,sans-serif" font-size="10"
      text-anchor="middle" fill="#888">(Boden, mittig)</text>

<!-- == Bemaßung Seitenansicht == -->

<!-- Tiefe: 10 cm (oben) -->
<line x1="430" y1="75" x2="530" y2="75" stroke="#444" stroke-width="1.2"
      marker-start="url(#arr-s)" marker-end="url(#arr)"/>
<text x="480" y="71" font-family="Arial,sans-serif" font-size="11"
      text-anchor="middle" fill="#444">10 cm</text>
<line x1="430" y1="76" x2="430" y2="100" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="530" y1="76" x2="530" y2="100" stroke="#AAA" stroke-width="0.8" stroke-dasharray="3,3"/>

<!-- ═══════════════════════════════════════════════════════════
     LEGENDE + HINWEISE
     ═══════════════════════════════════════════════════════════ -->
<line x1="30" y1="665" x2="650" y2="665" stroke="#DDD" stroke-width="1"/>

<text x="40" y="683" font-family="Arial,sans-serif" font-size="12"
      font-weight="bold" fill="#222">Legende</text>

<!-- Holz -->
<rect x="40" y="690" width="18" height="11" fill="#EDD9A3" stroke="#555" stroke-width="1"/>
<text x="65" y="701" font-family="Arial,sans-serif" font-size="11" fill="#333">Holzfläche</text>

<!-- Trennsteg -->
<line x1="145" y1="696" x2="168" y2="696" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="175" y="701" font-family="Arial,sans-serif" font-size="11" fill="#333">Feldbegrenzung / Trennsteg</text>

<!-- Loch -->
<circle cx="49" cy="721" r="4" fill="white" stroke="#333" stroke-width="1.8"/>
<text x="65" y="725" font-family="Arial,sans-serif" font-size="11" fill="#333">Bohrung</text>

<!-- USB -->
<rect x="145" y="715" width="18" height="11" fill="none" stroke="#777"
      stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="175" y="725" font-family="Arial,sans-serif" font-size="11" fill="#333">Ausschnitt (nicht sichtbar von außen)</text>

<text x="40" y="750" font-family="Arial,sans-serif" font-size="11"
      font-weight="bold" fill="#222">Hinweise:</text>
<text x="40" y="766" font-family="Arial,sans-serif" font-size="11" fill="#333">·  Wandstärke: ~10 mm (Sperrholz oder MDF)</text>
<text x="40" y="782" font-family="Arial,sans-serif" font-size="11" fill="#333">·  LED-Streifen je Feld zickzack verlegt (4 Reihen à ~9 LEDs), an Vorderkante fixiert</text>
<text x="40" y="798" font-family="Arial,sans-serif" font-size="11" fill="#333">·  ESP32 + Verkabelung im mittleren Fach (Gelb), hinter dem LED-Streifen</text>

</svg>
